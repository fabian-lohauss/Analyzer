name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WdsfAnalyzer.slnx

      - name: Test
        run: dotnet test WdsfAnalyzer.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/WdsfAnalyzer.Web/WdsfAnalyzer.Web.csproj --configuration Release --no-restore --output publish

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Reset interrupted slot swap
        continue-on-error: true
        run: |
          app_id=$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --query id \
            --output tsv 2>/dev/null) || true

          if [[ -z "$app_id" ]] || ! az resource show --ids "$app_id/slots/staging" >/dev/null 2>&1; then
            echo "No existing staging slot; skipping swap reset."
            exit 0
          fi

          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --slot staging \
            --target-slot production \
            --action reset

      - name: Provision Azure resources
        run: |
          az deployment group create \
            --name main \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters appName="${{ vars.AZURE_APP_NAME }}"

      - name: Deploy staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          slot-name: staging
          package: publish

      - name: Verify staging slot
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${{ vars.AZURE_APP_NAME }}-staging.azurewebsites.net/health"

      - name: Swap into production
        run: az webapp deployment slot swap --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_APP_NAME }}" --slot staging --target-slot production
