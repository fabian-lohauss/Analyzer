name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WdsfAnalyzer.slnx

      - name: Test
        run: dotnet test WdsfAnalyzer.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/WdsfAnalyzer.Web/WdsfAnalyzer.Web.csproj --configuration Release --no-restore --output publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure resources
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: appName=${{ vars.AZURE_APP_NAME }}
          failOnStdErr: false

      - name: Deploy staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          slot-name: staging
          package: publish

      - name: Verify staging slot
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${{ vars.AZURE_APP_NAME }}-staging.azurewebsites.net/health"

      - name: Swap into production
        run: az webapp deployment slot swap --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_APP_NAME }}" --slot staging --target-slot production
